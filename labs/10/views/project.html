<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Details</title>
    <link rel="stylesheet" href="{{ url_for('styles', path='/styles.css' )}}">
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
    </nav>
    <h1>{{ project.name }}</h1>
    <p>{{ project.description }}</p>

    <details>
      <summary>Edit</summary>
      <form action="/project/edit/{{ project.id }}" method="POST" class="new_project_form">
      <div>
        <label for="project_name">Project name:</label>
        <input name="project_name" value="{{ project.name }}">
      </div>
      <div>
        <label for="project_description">Description</label>
        <textarea name="project_description" rows="5">{{ project.description }}</textarea>
      </div>
      <input type="submit" class="btn primary-btn">
    </form>
    </details>
    <br />
    <details>
      <summary>Delete</summary>
      <br />
      <form action="/project/delete/{{ project.id }}" method="POST" >
        <input type="submit" value="Delete" class="btn delete-btn">
      </form>
    </details>
  </body>
</html>
